apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clavier-quest
  namespace: clavier-quest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clavier-quest
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
