apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clavier-quest
  namespace: clavier-quest
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: clavier-quest.duhaz.fr
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: clavier-quest
                port:
                  number: 80
