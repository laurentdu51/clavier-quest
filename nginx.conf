server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Endpoint de santé (probes Kubernetes)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets statiques : revalidation systématique via ETag.
    # Les noms de fichiers ne changent pas d'un déploiement à l'autre ; un cache
    # long ferait servir une ancienne version de l'app (JS périmé). On force donc
    # le navigateur à revalider (réponse 304 si inchangé, très léger).
    location ~* \.(css|js|svg|png|jpe?g|gif|ico|webp|woff2?)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Le reste : sert le fichier, sinon retombe sur index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
