server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Endpoint de santé (probes Kubernetes)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets statiques : cache long (les noms de fichiers changent rarement ici)
    location ~* \.(css|js|svg|png|jpe?g|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Le reste : sert le fichier, sinon retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
